spring.application.name=file-service
server.port=${SERVER_PORT:8082}
archive.inbox.dir=${ARCHIVE_INBOX_DIR:./inbox}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://weather:weather@localhost:27017/weatherdb?authSource=admin}

messaging.kafka.enabled=${MESSAGING_KAFKA_ENABLED:false}
messaging.kafka.topic.dump-requested=${MESSAGING_KAFKA_TOPIC_DUMP_REQUESTED:weather.dump.requested.v1}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:file-service-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.dzaro.file_service.event.DumpRequestedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dzaro.file_service.event
spring.kafka.listener.missing-topics-fatal=false