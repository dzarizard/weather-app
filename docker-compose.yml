services:
  postgres:
    image: postgres:16
    container_name: weather-postgres
    environment:
      POSTGRES_DB: weatherdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    container_name: weather-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: weather
      MONGO_INITDB_ROOT_PASSWORD: weather
      MONGO_INITDB_DATABASE: weatherdb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7
    container_name: weather-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  kafka:
    image: apache/kafka:3.8.0
    container_name: weather-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"

  weather-adapter:
    build: ./weather-adapter
    container_name: weather-adapter
    environment:
      SERVER_PORT: 8081
      ADAPTER_EXTERNAL_BASE_URL: https://api.openweathermap.org
      ADAPTER_EXTERNAL_API_KEY: 68b5417b7e7860f81645a747ce6a521a
    ports:
      - "8081:8081"
    depends_on:
      - postgres

  weather-service:
    build: ./weather-service
    container_name: weather-service
    environment:
      SERVER_PORT: 8080
      ADAPTER_BASE_URL: http://weather-adapter:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/weatherdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      WEATHER_CACHE_REDIS_ENABLED: true
      WEATHER_CACHE_REDIS_TTL: 5m
      DUMP_INBOX_DIR: /inbox
      MESSAGING_KAFKA_ENABLED: true
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./inbox:/inbox
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - weather-adapter
      - redis
      - kafka

  file-service:
    build: ./file-service
    container_name: file-service
    environment:
      SERVER_PORT: 8082
      ARCHIVE_INBOX_DIR: /inbox
      SPRING_DATA_MONGODB_URI: mongodb://weather:weather@mongo:27017/weatherdb?authSource=admin
      MESSAGING_KAFKA_ENABLED: true
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./inbox:/inbox
    ports:
      - "8082:8082"
    depends_on:
      - mongo
      - kafka

volumes:
  pg-data:
  mongo-data:
  redis-data:
